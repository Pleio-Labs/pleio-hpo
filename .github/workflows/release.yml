name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi          # must match the environment name set in the PyPI publisher
    permissions:
      id-token: write          # OIDC token for PyPI Trusted Publishing (no API token needed)
      contents: read           # checkout needs this for a private repo (perms block defaults the rest to none)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
