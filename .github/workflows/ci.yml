name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-sapbert-v1
      - name: Install
        run: pip install -e ".[dev]"
      - name: Download spaCy model
        run: python -m spacy download en_core_web_sm
      - name: Lint
        run: ruff check src/ tests/
      - name: Typecheck
        run: mypy src/pleio_hpo/
      - name: Test
        # No --cov-fail-under here: CI has no embedding index / validator
        # checkpoint (gitignored, fetched on demand), so the pipeline tests skip
        # and coverage is artificially low. The 90% gate runs in `make test`,
        # locally / wherever the assets are present. Coverage is still reported.
        run: pytest --cov=src/pleio_hpo
